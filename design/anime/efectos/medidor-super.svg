<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" fill="none" role="img">
  <title>Medidor de super</title>
  <desc>Cuatro segmentos en paralelogramo. Arriba, vacío. Abajo, lleno, con el tramo final en oro.</desc>
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="0.75" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#FFE14A"/>
    </linearGradient>
    <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.15" fill="#05060A"/>
    </pattern>
  </defs>
  <g>
    <polygon points="10,8 82,8 74,26 2,26" fill="#171C28" stroke="#3DF0FF" stroke-width="1.5"/>
    <polygon points="96,8 168,8 160,26 88,26" fill="#171C28" stroke="#3DF0FF" stroke-width="1.5"/>
    <polygon points="182,8 254,8 246,26 174,26" fill="#171C28" stroke="#3DF0FF" stroke-width="1.5"/>
    <polygon points="268,8 340,8 332,26 260,26" fill="#171C28" stroke="#3DF0FF" stroke-width="1.5"/>
  </g>
  <g>
    <polygon points="10,40 82,40 74,58 2,58" fill="url(#hot)"/>
    <polygon points="10,40 82,40 74,58 2,58" fill="url(#tone)" opacity="0.8"/>
    <polygon points="96,40 168,40 160,58 88,58" fill="url(#hot)"/>
    <polygon points="96,40 168,40 160,58 88,58" fill="url(#tone)" opacity="0.8"/>
    <polygon points="182,40 254,40 246,58 174,58" fill="url(#hot)"/>
    <polygon points="182,40 254,40 246,58 174,58" fill="url(#tone)" opacity="0.8"/>
    <polygon points="268,40 340,40 332,58 260,58" fill="url(#hot)"/>
    <polygon points="268,40 340,40 332,58 260,58" fill="url(#tone)" opacity="0.8"/>
  </g>
</svg>
