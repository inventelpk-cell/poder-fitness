<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Reproductor — impacto</title>
  <link rel="stylesheet" href="escena.css" />
</head>
<body>
  <main class="telefono telefono--pelea telefono--impacto">
    <img class="pf-rayos" src="../efectos/rayos.svg" alt="" />
    <div class="pf-flash"></div>
    <div class="pf-marco" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <header class="asalto">
      <a class="volver" href="#hoy" aria-label="Volver">‹</a>
      <div class="meta">
        <strong>Ejercicio 2 de 4</strong>
        <span class="pf-placa"><span>Impacto</span></span>
      </div>
    </header>

    <article class="pf-panel carta pf-escenario">
      <img class="pf-lineas" src="../efectos/lineas-velocidad.svg" alt="" />
      <div class="ventana">
        <img src="press-banca.svg" alt="Press banca, dibujo de línea sobre negro." />
      </div>
      <p class="pf-xp">+40 XP</p>
      <div class="sello-flotante pf-hecho">Hecho</div>
      <div class="placa-nombre">
        <span class="pf-placa"><span>Barra · Pecho</span></span>
        <h2>Press banca</h2>
        <p class="carga">60 kg × 6</p>
      </div>
    </article>

    <section class="series" aria-label="Series">
      <div class="serie hecha"><span>01</span><span>60 kg</span><span class="estado">Hecha</span></div>
      <div class="serie hecha"><span>02</span><span>60 kg</span><span class="estado">Hecha</span></div>
      <div class="serie"><span>03</span><span>60 kg</span><span class="estado">—</span></div>
      <div class="serie"><span>04</span><span>60 kg</span><span class="estado">—</span></div>
    </section>

    <div class="zona-descanso">
      <button class="paso" type="button">−15</button>
      <div>
        <p class="leyenda-descanso">DESCANSO</p>
        <div class="pf-anillo" style="--p: 0.72">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="pista" cx="60" cy="60" r="52"></circle>
            <circle class="arco" cx="60" cy="60" r="52"></circle>
            <circle class="punta" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="pf-anillo__cifra">1:30</div>
        </div>
      </div>
      <button class="paso" type="button">+15</button>
    </div>
  </main>
</body>
</html>
