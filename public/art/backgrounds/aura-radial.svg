      <stop offset="0%" stop-color="#FFF6E4" stop-opacity="0.2"/>
      <stop offset="18%" stop-color="#FF6A1A" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FF6A1A" stop-opacity="0.16"/>
      <stop offset="72%" stop-color="#3B82FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B82FF" stop-opacity="0"/>
